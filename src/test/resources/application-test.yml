# 테스트 오버레이 설정.
#
# 파일명이 application-test.yml 인 것이 중요하다. src/test/resources/application.yml 로 두면
# 클래스패스에서 main 의 application.yml 을 통째로 가려 버린다 — 덮어쓰는 게 아니라 사라진다.
# 그러면 테스트는 운영 설정이 아니라 @ConfigurationProperties 의 자바 기본값을 검증하게 되고,
# 둘이 어긋난 순간(default-template-version 이 실제로 그랬다) 테스트는 통과하는데 운영은 다르다.
# profile 로 올려 두면 main 설정 위에 이 파일이 얹힌다.
#
# 경로를 @TempDir 로 클래스마다 다르게 주면 @DynamicPropertySource 때문에 Spring 컨텍스트가
# 클래스 수만큼 새로 뜬다. 통합 테스트 5개면 부팅 5번이다. 고정 경로를 쓰면 컨텍스트를 공유하고,
# 대신 테스트마다 상태를 지우는 책임을 IssuanceTestBase 가 진다.
epolicy:
  storage:
    root: build/test-work/documents
  sign:
    keystore-path: build/test-work/certs/test-signer.p12
  pdf:
    spool-dir: build/test-work/spool

spring:
  jpa:
    hibernate:
      ddl-auto: create-drop

logging:
  level:
    com.hyunolike.epolicy: WARN
    org.springframework.batch: WARN
    org.hibernate: WARN
    com.openhtmltopdf: ERROR
    org.apache.pdfbox.pdmodel.font: ERROR
    org.verapdf: ERROR
