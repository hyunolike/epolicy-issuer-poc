spring:
  application:
    name: epolicy-issuer

  datasource:
    url: jdbc:h2:mem:epolicy;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    # 배치 스레드에서 세션이 열린 채 돌아다니면 파티셔닝 시 커넥션이 말라붙는다.
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 100
        order_inserts: true
        order_updates: true

  batch:
    jdbc:
      initialize-schema: always
    job:
      # 기동하자마자 1만 건을 돌리지 않는다. /api/admin/batch/run 으로 명시적으로 띄운다.
      enabled: false

  thymeleaf:
    cache: true

  h2:
    console:
      enabled: true

epolicy:
  issuer-name: 하이퍼라이크화재해상보험
  default-template-version: v1
  pdf:
    # memory | temp-file — 배치 메모리 측정의 스위치
    buffer-strategy: memory
    spool-dir: build/spool
    subset-fonts: true
  sign:
    enabled: true
    keystore-path: build/certs/test-signer.p12
    keystore-password: changeit
    key-alias: epolicy-test-signer
    generate-if-absent: true
    tsa:
      # 공개 TSA 는 외부 네트워크가 필요하다. B-T 를 검증할 때만 켠다.
      enabled: false
      url: https://freetsa.org/tsr
      timeout-millis: 5000
  storage:
    type: local
    root: build/documents
  batch:
    chunk-size: 100
    partition-count: 1
    grid-concurrency: 4
    skip-limit: 100
    page-size: 100

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  metrics:
    distribution:
      percentiles-histogram:
        epolicy.issue.total: true
      percentiles:
        epolicy.issue.total: 0.5, 0.95, 0.99
        epolicy.issue.stage: 0.5, 0.95

logging:
  level:
    com.hyunolike.epolicy: INFO
    # openhtmltopdf 는 폰트 대체 등으로 경고를 많이 낸다. 필요할 때만 켠다.
    com.openhtmltopdf: ERROR
    # openhtmltopdf 의 BuiltinFontStore 는 렌더러를 만들 때마다 표준 14폰트(Courier/Times/
    # Helvetica/Symbol/ZapfDingbats)를 PDType1Font 로 전부 생성한다. 우리 문서는 나눔고딕만 쓰므로
    # 이 폰트들은 산출물에 들어가지 않지만(테스트로 고정), PDFBox 는 생성 시 시스템 폰트를 찾아
    # 대체하면서 문서당 경고 한 줄을 남긴다. 1만 건이면 1만 줄이라 끈다.
    # 부작용 하나는 알고 있어야 한다 — 시스템 폰트가 하나도 없는 최소 컨테이너에서는 이 대체가
    # 실패할 수 있다. 배포 이미지에 기본 폰트 패키지를 하나는 남겨 둔다.
    org.apache.pdfbox.pdmodel.font: ERROR
    org.springframework.batch: INFO

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/epolicy
    driver-class-name: org.postgresql.Driver
    username: epolicy
    password: epolicy
    hikari:
      # 파티션 워커 + 웹 요청이 동시에 커넥션을 잡는다. grid-concurrency 보다 넉넉히.
      maximum-pool-size: 16
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
